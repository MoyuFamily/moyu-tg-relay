[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moyu-tg-relay"
version = "0.1.0"
description = "Moyu Telegram OTP relay service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.8",
  "uvicorn[standard]==0.34.0",
  "telethon==1.38.1",
  "pydantic==2.10.6",
  "requests==2.32.3",
]

[tool.setuptools.packages.find]
where = ["src"]
