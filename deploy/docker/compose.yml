services:
  moyu-tg-relay:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: moyufamily/moyu-tg-relay:latest
    container_name: moyu-tg-relay
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      OTP_RELAY_BEARER_TOKEN: "${OTP_RELAY_BEARER_TOKEN}"
      TELEGRAM_API_ID: "${TELEGRAM_API_ID}"
      TELEGRAM_API_HASH: "${TELEGRAM_API_HASH}"
      TELEGRAM_ACCOUNT_ID: "${TELEGRAM_ACCOUNT_ID}"
      TELEGRAM_SESSION_PATH: /data/telegram.session
      HAX_TELEGRAM_BOT: "${HAX_TELEGRAM_BOT:-HaxTG_bot}"
    volumes:
      - moyu-tg-relay-data:/data

volumes:
  moyu-tg-relay-data:
